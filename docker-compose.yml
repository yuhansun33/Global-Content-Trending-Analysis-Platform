version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - data-platform

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - data-platform

  spark-master:
    image: tabulario/spark-iceberg:3.5.1_1.5.2
    container_name: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-your_access_key_here}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-your_secret_key_here}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./workspace:/home/iceberg/workspace
      - ./data:/home/iceberg/data
    networks:
      - data-platform

  spark-worker:
    image: tabulario/spark-iceberg:3.5.1_1.5.2
    container_name: spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-your_access_key_here}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-your_secret_key_here}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    ports:
      - "8081:8081"
    volumes:
      - ./workspace:/home/iceberg/workspace
      - ./data:/home/iceberg/data
    networks:
      - data-platform

  jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: jupyter
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-your_access_key_here}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-your_secret_key_here}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    volumes:
      - ./workspace:/home/jovyan/work
      - ./data:/home/jovyan/data
    networks:
      - data-platform

networks:
  data-platform:
    driver: bridge
