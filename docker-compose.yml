# =============================================================================
# Kafka + Spark Stack (Local / AWS EC2)
# =============================================================================
# Usage:
#   Local:  docker compose up -d
#   AWS:    export KAFKA_EXTERNAL_HOST=<EC2-PUBLIC-IP> && docker compose up -d
# =============================================================================

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - data-platform

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # KAFKA_EXTERNAL_HOST: set to EC2 public IP for remote producer access
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://${KAFKA_EXTERNAL_HOST:-localhost}:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - data-platform

  spark:
    image: apache/spark:3.5.3-python3
    container_name: spark
    env_file:
      - path: .env
        required: false
    environment:
      - SPARK_NO_DAEMONIZE=true
      - GOOGLE_APPLICATION_CREDENTIALS=/opt/spark/conf/gcp-key.json
      # Kafka broker - change to remote IP for distributed deployment
      - KAFKA_BROKER=${KAFKA_BROKER:-kafka:9092}
    ports:
      - "4040:4040"
    volumes:
      - ./workspace:/opt/spark/work-dir/workspace
      - ./data:/opt/spark/work-dir/data
      - ./gcp-key.json:/opt/spark/conf/gcp-key.json:ro
    networks:
      - data-platform
    command: ["tail", "-f", "/dev/null"]

  jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: jupyter
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-your_access_key_here}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-your_secret_key_here}
      - AWS_REGION=${AWS_REGION:-us-east-1}
    volumes:
      - ./workspace:/home/jovyan/work
      - ./data:/home/jovyan/data
    networks:
      - data-platform

networks:
  data-platform:
    driver: bridge
